# docker-compose.yml
#
# Default Personal CRM stack — single container, SQLite, local filesystem for attachments.
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml logs -f
#   docker compose -f docker/docker-compose.yml down
#
# To enable S3-compatible attachments (MinIO), uncomment the "minio" and "createbuckets"
# services, set AttachmentStore__Provider=s3 in the "app" environment, and add the
# S3 env vars listed below the local ones.

name: personal-crm

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    image: ghcr.io/personal-crm/personal-crm:latest
    container_name: personal-crm
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # All persistent state lives in ./data
      - ./data:/app/data
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      # --- Database ---
      # SQLite lives inside /app/data; default is a single file with WAL.
      ConnectionStrings__Default: "Data Source=/app/data/personal-crm.db;Cache=Shared"

      # --- Attachment storage ---
      # Default: local filesystem at /app/data/attachments
      AttachmentStore__Provider: local
      AttachmentStore__LocalRoot: /app/data/attachments

      # --- To enable S3 instead, set Provider=s3 and uncomment these ---
      # AttachmentStore__Provider: s3
      # AttachmentStore__S3__Endpoint: http://minio:9000
      # AttachmentStore__S3__Bucket: personal-crm
      # AttachmentStore__S3__Region: us-east-1
      # AttachmentStore__S3__AccessKey: minioadmin
      # AttachmentStore__S3__SecretKey: minioadmin
      # AttachmentStore__S3__ForcePathStyle: "true"

      # --- Auth (REQUIRED: replace these in production) ---
      # Generate a strong random value: openssl rand -hex 64
      Auth__JwtSigningKey: "REPLACE_ME_WITH_AT_LEAST_64_HEX_CHARS"
      Auth__JwtIssuer: "http://localhost:8080"
      Auth__JwtAudience: "personal-crm"
      Auth__AccessTokenMinutes: "15"
      Auth__RefreshTokenDays: "30"

      # --- Email (optional at first-run; configure via UI later) ---
      # Smtp__Host: smtp.example.com
      # Smtp__Port: "587"
      # Smtp__Username: crm@example.com
      # Smtp__Password: changeme
      # Smtp__FromAddress: crm@example.com
      # Smtp__FromName: "Personal CRM"
      # Smtp__UseStartTls: "true"

      # --- Web push (optional) ---
      # Vapid__PublicKey: "..."
      # Vapid__PrivateKey: "..."
      # Vapid__Subject: "mailto:admin@example.com"

      # --- Observability (optional) ---
      # Otel__OtlpEndpoint: http://otel-collector:4317
      # Otel__ServiceName: personal-crm

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Optional S3-compatible object storage (uncomment to enable)
  # ---------------------------------------------------------------------------
